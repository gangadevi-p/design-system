<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Design Tool-kit</title>
  <meta name="description" content="Typography, colours, variables, buttons and components of the design system.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css?v=01267b0a">
  <link rel="stylesheet" href="css/base.css?v=142d55fd">
  <link rel="stylesheet" href="css/buttons.css?v=b035f32a">
  <link rel="stylesheet" href="css/components.css?v=46c6d89d">
  <link rel="stylesheet" href="css/site.css?v=3b4dd04a">
</head>
<body>
  <div class="shell">
    <header class="menubar">
      <button class="menu-trigger" id="menu-trigger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="menubar-title"><span class="menubar-sub">Design Tool-kit</span><span class="menubar-page" id="menubar-page"></span></span>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Design Tool-kit navigation">
      <div class="sidebar-head">
        <button class="back-trigger" id="back-trigger" type="button" aria-label="Back to portfolio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/><path d="M8 12h10"/></svg>
        </button>
        <a class="brand" href="#components">
          <span class="brand-text"><span class="brand-sub">Design Tool-kit</span></span>
        </a>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="search">
        <button class="search-trigger" id="search-trigger" type="button" aria-label="Search this page" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
          <span>Search this page</span>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Sections"></nav>

      <div class="save">
        <button class="save-toggle" id="save-open" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg>
          <span>Save here</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <dialog class="save-dialog" id="save-dialog" aria-labelledby="save-dialog-title">
      <form class="save-form" id="save-form" novalidate>
        <div class="save-dialog-head">
          <h2 class="dialog-title" id="save-dialog-title">Save here</h2>
          <button class="save-dialog-close" id="save-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="field" id="save-title-field">
          <label class="field-label" for="save-title">Title</label>
          <input class="input" id="save-title" name="title" type="text" maxlength="80" placeholder="Name what you found" autocomplete="off" required aria-describedby="save-title-help">
          <span class="field-help" id="save-title-help" hidden>Add a title to save this.</span>
        </div>
        <div class="field">
          <label class="field-label" for="save-category">Category</label>
          <div class="select-native">
            <select class="input" id="save-category" name="category"></select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="field" id="save-new-field" hidden>
          <label class="field-label" for="save-new">New category name</label>
          <input class="input" id="save-new" name="newCategory" type="text" maxlength="30" placeholder="e.g. Portfolio" autocomplete="off" aria-describedby="save-new-help">
          <span class="field-help" id="save-new-help" hidden>Name the new category.</span>
        </div>
        <div class="field">
          <label class="field-label" for="save-note">Note</label>
          <textarea class="input input--textarea" id="save-note" name="note" rows="3" maxlength="500" placeholder="Why is it worth saving?"></textarea>
        </div>
        <p class="save-privacy">Stays in this browser only. Nobody else can see what you save.</p>
        <div class="dialog-actions">
          <button class="btn btn--ghost" id="save-cancel" type="button">Cancel</button>
          <button class="btn btn--primary" id="save-submit" type="submit">Save</button>
        </div>
      </form>
    </dialog>
    <div class="save-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <main class="main" id="pages"></main>
  </div>

  <script src="js/data.js?v=27465208"></script>
  <script src="js/app.js?v=7c43cc7e"></script>
</body>
</html>
